version: "3.8"

services:
  feishu-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: feishu-bot-service:latest
    container_name: feishu-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
